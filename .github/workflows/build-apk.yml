name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL file ZIP untuk di-build'
        required: true
        type: string
      tag:
        description: 'Tag version (contoh: v1.0.0)'
        required: true
        type: string
      build_type:
        description: 'Tipe Build (release/debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      app_name:
        description: 'Nama Aplikasi'
        required: false
        type: string
        default: 'FlutterApp'

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.16.0'
  ANDROID_SDK_VERSION: '9477386'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    outputs:
      apk_name: ${{ steps.apk_info.outputs.apk_file }}
      apk_size: ${{ steps.apk_info.outputs.apk_size }}
      build_status: ${{ job.status }}

    steps:
      # ─────────────────────────────────────────────────────────────────
      # 1. CHECKOUT & SETUP ENVIRONMENT
      # ─────────────────────────────────────────────────────────────────
      
      - name: '📋 Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: '🔍 Print Input Parameters'
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "📥 INPUT PARAMETERS"
          echo "════════════════════════════════════════════════════════"
          echo "🔗 ZIP URL: ${{ github.event.inputs.zip_url }}"
          echo "🏷️  Tag: ${{ github.event.inputs.tag }}"
          echo "🔧 Build Type: ${{ github.event.inputs.build_type }}"
          echo "📱 App Name: ${{ github.event.inputs.app_name }}"
          echo "════════════════════════════════════════════════════════"

      # ─────────────────────────────────────────────────────────────────
      # 2. SETUP JAVA
      # ─────────────────────────────────────────────────────────────────
      
      - name: '☕ Setup Java JDK'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: '✅ Verify Java Installation'
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────────────────
      # 3. SETUP ANDROID SDK
      # ─────────────────────────────────────────────────────────────────
      
      - name: '🤖 Setup Android SDK'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_SDK_VERSION }}
      
      - name: '✅ Accept Android Licenses'
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # ─────────────────────────────────────────────────────────────────
      # 4. SETUP FLUTTER
      # ─────────────────────────────────────────────────────────────────
      
      - name: '🦋 Setup Flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: '✅ Verify Flutter Installation'
        run: |
          flutter --version
          flutter doctor -v

      # ─────────────────────────────────────────────────────────────────
      # 5. DOWNLOAD ZIP FROM URL
      # ─────────────────────────────────────────────────────────────────
      
      - name: '📥 Download ZIP from URL'
        id: download
        run: |
          mkdir -p ./project_source
          cd ./project_source
          
          echo "⏳ Downloading from: ${{ github.event.inputs.zip_url }}"
          
          # Download dengan retry logic
          MAX_ATTEMPTS=3
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "📥 Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            if curl -L -f -o source.zip "${{ github.event.inputs.zip_url }}" --connect-timeout 30 --max-time 300; then
              FILE_SIZE=$(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip 2>/dev/null)
              echo "✅ Download berhasil! Size: $(numfmt --to=iec $FILE_SIZE 2>/dev/null || echo $FILE_SIZE bytes)"
              echo "download_success=true" >> $GITHUB_OUTPUT
              break
            else
              echo "❌ Download gagal pada attempt $ATTEMPT"
              ATTEMPT=$((ATTEMPT+1))
              if [ $ATTEMPT -le $MAX_ATTEMPTS ]; then
                sleep 5
              fi
            fi
          done
          
          if [ "${{ steps.download.outputs.download_success }}" != "true" ]; then
            echo "❌ Gagal download setelah $MAX_ATTEMPTS attempts"
            exit 1
          fi
      
      - name: '📂 Extract ZIP File'
        run: |
          cd ./project_source
          
          if [ ! -f "source.zip" ]; then
            echo "❌ File source.zip tidak ditemukan"
            exit 1
          fi
          
          echo "📂 Extracting ZIP..."
          unzip -q -o source.zip
          
          # Hapus ZIP setelah extract
          rm -f source.zip
          
          echo "✅ Extract selesai"
          echo ""
          echo "📂 Directory structure:"
          ls -lah
          echo ""
          echo "Files in current directory:"
          find . -maxdepth 2 -type f | head -20

      # ─────────────────────────────────────────────────────────────────
      # 6. DETECT PROJECT TYPE
      # ─────────────────────────────────────────────────────────────────
      
      - name: '🔍 Detect Project Type'
        id: detect
        run: |
          cd ./project_source
          
          PROJECT_TYPE="unknown"
          
          if [ -f "pubspec.yaml" ]; then
            PROJECT_TYPE="flutter"
            echo "✅ Detected: Flutter Project"
          elif [ -f "build.gradle" ] || [ -f "app/build.gradle" ]; then
            PROJECT_TYPE="android"
            echo "✅ Detected: Android Studio Project"
          elif [ -f "package.json" ]; then
            if grep -q "react-native" package.json; then
              PROJECT_TYPE="react-native"
              echo "✅ Detected: React Native Project"
            else
              PROJECT_TYPE="react-web"
              echo "✅ Detected: React Web Project"
            fi
          else
            PROJECT_TYPE="flutter"
            echo "⚠️ Unknown project type, defaulting to Flutter"
          fi
          
          echo "project_type=$PROJECT_TYPE" >> $GITHUB_OUTPUT
          echo ""
          echo "Project Type: $PROJECT_TYPE"

      # ─────────────────────────────────────────────────────────────────
      # 7. BUILD FLUTTER APK
      # ─────────────────────────────────────────────────────────────────
      
      - name: '🔨 Build Flutter APK'
        if: steps.detect.outputs.project_type == 'flutter'
        id: flutter_build
        run: |
          set +e  # Don't exit on error
          
          cd ./project_source
          
          echo "════════════════════════════════════════════════════════"
          echo "🦋 FLUTTER BUILD PROCESS"
          echo "════════════════════════════════════════════════════════"
          
          # 1. Clean
          echo "🧹 Cleaning Flutter project..."
          flutter clean
          
          # 2. Get dependencies
          echo "📦 Getting Flutter dependencies..."
          if ! flutter pub get; then
            echo "❌ Flutter pub get failed"
            exit 1
          fi
          
          # 3. Build APK
          echo "🔨 Building APK (build_type: ${{ github.event.inputs.build_type }})..."
          
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "📱 Building RELEASE APK with split-per-abi..."
            flutter build apk --release --split-per-abi --verbose 2>&1 | tee build.log
            BUILD_EXIT_CODE=${PIPESTATUS[0]}
          else
            echo "📱 Building DEBUG APK..."
            flutter build apk --debug --verbose 2>&1 | tee build.log
            BUILD_EXIT_CODE=${PIPESTATUS[0]}
          fi
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Flutter build failed with exit code $BUILD_EXIT_CODE"
            echo ""
            echo "📋 Last 50 lines of build log:"
            tail -50 build.log
            exit 1
          fi
          
          echo "✅ Flutter build selesai"
          echo "build_success=true" >> $GITHUB_OUTPUT
      
      - name: '📦 Copy Flutter APK'
        if: steps.detect.outputs.project_type == 'flutter' && steps.flutter_build.outputs.build_success == 'true'
        run: |
          mkdir -p ./app_build
          cd ./project_source
          
          echo "📂 Copying APK files..."
          
          # Cari APK files
          if [ -d "build/app/outputs/flutter-apk" ]; then
            echo "✅ Found flutter-apk directory"
            find build/app/outputs/flutter-apk -name "*.apk" -exec cp {} ../app_build/ \;
          elif [ -d "build/app/outputs/apk" ]; then
            echo "✅ Found apk directory"
            find build/app/outputs/apk -name "*.apk" -exec cp {} ../app_build/ \;
          else
            echo "🔍 Searching for APK files..."
            find . -name "*.apk" -type f -exec cp {} ../app_build/ \;
          fi
          
          APK_COUNT=$(find ../app_build -name "*.apk" -type f | wc -l)
          if [ $APK_COUNT -gt 0 ]; then
            echo "✅ Found $APK_COUNT APK file(s)"
            ls -lh ../app_build/
          else
            echo "❌ No APK files found"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────
      # 8. BUILD ANDROID STUDIO PROJECT
      # ─────────────────────────────────────────────────────────────────
      
      - name: '🔨 Build Android Studio APK'
        if: steps.detect.outputs.project_type == 'android'
        id: android_build
        run: |
          set +e
          
          cd ./project_source
          
          echo "════════════════════════════════════════════════════════"
          echo "🤖 ANDROID STUDIO BUILD PROCESS"
          echo "════════════════════════════════════════════════════════"
          
          # Check gradlew
          if [ ! -f "gradlew" ]; then
            echo "❌ gradlew tidak ditemukan"
            exit 1
          fi
          
          chmod +x gradlew
          
          echo "🔨 Building APK (build_type: ${{ github.event.inputs.build_type }})..."
          
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "📱 Building RELEASE APK..."
            ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
            BUILD_EXIT_CODE=${PIPESTATUS[0]}
          else
            echo "📱 Building DEBUG APK..."
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
            BUILD_EXIT_CODE=${PIPESTATUS[0]}
          fi
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Android build failed"
            echo ""
            echo "📋 Last 50 lines of build log:"
            tail -50 build.log
            exit 1
          fi
          
          echo "✅ Android build selesai"
          echo "build_success=true" >> $GITHUB_OUTPUT
      
      - name: '📦 Copy Android APK'
        if: steps.detect.outputs.project_type == 'android' && steps.android_build.outputs.build_success == 'true'
        run: |
          mkdir -p ./app_build
          cd ./project_source
          
          echo "📂 Copying APK files..."
          find . -path "*/build/outputs/apk/*/release/*.apk" -o -path "*/build/outputs/apk/*/debug/*.apk" | while read apk; do
            if [ -f "$apk" ]; then
              cp "$apk" ../app_build/
              echo "✅ Copied: $apk"
            fi
          done
          
          APK_COUNT=$(find ../app_build -name "*.apk" -type f | wc -l)
          if [ $APK_COUNT -gt 0 ]; then
            echo "✅ Found $APK_COUNT APK file(s)"
          else
            echo "❌ No APK files found"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────
      # 9. BUILD REACT NATIVE APK
      # ─────────────────────────────────────────────────────────────────
      
      - name: '🔨 Build React Native APK'
        if: steps.detect.outputs.project_type == 'react-native'
        id: rn_build
        run: |
          set +e
          
          cd ./project_source
          
          echo "════════════════════════════════════════════════════════"
          echo "⚛️  REACT NATIVE BUILD PROCESS"
          echo "════════════════════════════════════════════════════════"
          
          # Setup Node.js
          echo "📦 Installing Node.js dependencies..."
          npm install --omit=dev 2>&1 | tail -20
          
          if [ ! -d "android" ]; then
            echo "❌ Android directory tidak ditemukan"
            exit 1
          fi
          
          cd android
          chmod +x gradlew
          
          echo "🔨 Building APK (build_type: ${{ github.event.inputs.build_type }})..."
          
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "📱 Building RELEASE APK..."
            ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
            BUILD_EXIT_CODE=${PIPESTATUS[0]}
          else
            echo "📱 Building DEBUG APK..."
            ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
            BUILD_EXIT_CODE=${PIPESTATUS[0]}
          fi
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ React Native build failed"
            tail -50 build.log
            exit 1
          fi
          
          echo "✅ React Native build selesai"
          echo "build_success=true" >> $GITHUB_OUTPUT
      
      - name: '📦 Copy React Native APK'
        if: steps.detect.outputs.project_type == 'react-native'
        run: |
          mkdir -p ./app_build
          cd ./project_source
          
          echo "📂 Copying APK files..."
          find . -name "*.apk" -type f -exec cp {} ../app_build/ \;
          
          APK_COUNT=$(find ../app_build -name "*.apk" -type f | wc -l)
          if [ $APK_COUNT -gt 0 ]; then
            echo "✅ Found $APK_COUNT APK file(s)"
          else
            echo "❌ No APK files found"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────
      # 10. PROCESS APK FILES
      # ─────────────────────────────────────────────────────────────────
      
      - name: '🏷️  Rename APK Files'
        id: rename
        run: |
          if [ ! -d "./app_build" ]; then
            echo "❌ app_build directory not found"
            exit 1
          fi
          
          cd ./app_build
          
          APK_FILES=$(find . -maxdepth 1 -name "*.apk" -type f | wc -l)
          if [ $APK_FILES -eq 0 ]; then
            echo "❌ No APK files found in app_build"
            exit 1
          fi
          
          echo "📝 Renaming $APK_FILES APK file(s)..."
          
          COUNTER=1
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              # Format: AppName_BuildType_Tag_RunID.apk
              NEW_NAME="${{ github.event.inputs.app_name }}_${{ github.event.inputs.build_type }}_${{ github.event.inputs.tag }}_${GITHUB_RUN_ID}.apk"
              
              # Handle multiple APKs
              if [ $APK_FILES -gt 1 ]; then
                NEW_NAME="${{ github.event.inputs.app_name }}_${{ github.event.inputs.build_type }}_${{ github.event.inputs.tag }}_${GITHUB_RUN_ID}_part${COUNTER}.apk"
                COUNTER=$((COUNTER+1))
              fi
              
              mv "$apk" "$NEW_NAME"
              echo "✅ Renamed: $apk → $NEW_NAME"
              
              # Save to output
              if [ $COUNTER -eq 2 ]; then
                echo "primary_apk=$NEW_NAME" >> $GITHUB_OUTPUT
              fi
            fi
          done
          
          echo ""
          echo "Final APK files:"
          ls -lh

      # ─────────────────────────────────────────────────────────────────
      # 11. UPLOAD AS GITHUB ARTIFACT
      # ─────────────────────────────────────────────────────────────────
      
      - name: '⬆️  Upload APK as Artifact'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-${{ github.event.inputs.tag }}
          path: ./app_build/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: '📊 Get APK Information'
        id: apk_info
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "📊 APK INFORMATION"
          echo "════════════════════════════════════════════════════════"
          
          cd ./app_build
          
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK file found"
            echo "apk_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "apk_found=true" >> $GITHUB_OUTPUT
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
          
          # Get size
          SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null)
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          SIZE_KB=$(echo "scale=0; $SIZE / 1024" | bc)
          
          echo "apk_size=$SIZE_MB" >> $GITHUB_OUTPUT
          
          # Get MD5
          MD5=$(md5sum "$APK_FILE" | awk '{print $1}')
          echo "apk_md5=$MD5" >> $GITHUB_OUTPUT
          
          # Display info
          echo "📱 APK Name: $APK_FILE"
          echo "📦 Size: $SIZE_MB MB ($SIZE_KB KB)"
          echo "🔐 MD5: $MD5"
          echo "📅 Build Date: $(date)"
          echo "🔧 Build Type: ${{ github.event.inputs.build_type }}"
          echo "🏷️  Tag: ${{ github.event.inputs.tag }}"
          echo "════════════════════════════════════════════════════════"

      # ─────────────────────────────────────────────────────────────────
      # 12. BUILD SUCCESS NOTIFICATION
      # ─────────────────────────────────────────────────────────────────
      
      - name: '✅ Build Success Summary'
        if: success() && steps.apk_info.outputs.apk_found == 'true'
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║                   ✅ BUILD SUCCESS                    ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
          echo "📊 BUILD SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📱 Application: ${{ github.event.inputs.app_name }}"
          echo "🔧 Build Type: ${{ github.event.inputs.build_type }}"
          echo "🏷️  Version Tag: ${{ github.event.inputs.tag }}"
          echo "📦 APK File: ${{ steps.apk_info.outputs.apk_file }}"
          echo "📊 Size: ${{ steps.apk_info.outputs.apk_size }} MB"
          echo "🔐 MD5: ${{ steps.apk_info.outputs.apk_md5 }}"
          echo "🏃 Run ID: ${{ github.run_id }}"
          echo "⏱️  Duration: $((${{ github.run_number }} % 60)) minutes"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✨ APK ready for download from Artifacts!"
          echo ""

      # ─────────────────────────────────────────────────────────────────
      # 13. BUILD FAILURE NOTIFICATION
      # ─────────────────────────────────────────────────────────────────
      
      - name: '❌ Build Failure Summary'
        if: failure()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║                   ❌ BUILD FAILED                     ║"
          echo "╚════════════════════════════════════════════════════════╝"
          echo ""
         r details"
          
