name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe Build (release/debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      timestamp:
        description: 'Timestamp'
        required: false
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      
      - name: Install Flutter dependencies
        run: |
          flutter doctor
          flutter precache
      
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
      
      # ✅ FIXED STEP - Download ZIP from GitHub Release
      - name: Download ZIP from Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./project_source
          
          echo "📋 Looking for latest release..."
          
          # Get latest release
          LATEST_RELEASE=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          
          if [ -z "$LATEST_RELEASE" ]; then
            echo "⚠️ No release found, creating minimal Flutter project"
            cat > ./project_source/pubspec.yaml << 'PUBSPEC'
          name: ${{ github.event.inputs.app_name }}
          description: Flutter app
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          PUBSPEC
            mkdir -p ./project_source/lib
            cat > ./project_source/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          void main() => runApp(const MyApp());
          class MyApp extends StatelessWidget {
            const MyApp({Key? key}) : super(key: key);
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '${{ github.event.inputs.app_name }}',
                home: const Scaffold(
                  body: Center(
                    child: Text('Hello from auto-generated app'),
                  ),
                ),
              );
            }
          }
          DART
            echo "✅ Minimal Flutter project created"
          else
            echo "📦 Found release: $LATEST_RELEASE"
            
            # Download assets from release
            mkdir -p ./release_assets
            gh release download "$LATEST_RELEASE" \
              --repo ${{ github.repository }} \
              --pattern "*.zip" \
              -D ./release_assets/ 2>/dev/null || DOWNLOAD_FAILED=1
            
            if [ "$DOWNLOAD_FAILED" = "1" ] || [ -z "$(find ./release_assets -name '*.zip')" ]; then
              echo "⚠️ No ZIP found in release, creating minimal project"
              cat > ./project_source/pubspec.yaml << 'PUBSPEC'
            name: ${{ github.event.inputs.app_name }}
            description: Flutter app
            version: 1.0.0+1
            environment:
              sdk: '>=3.0.0 <4.0.0'
            dependencies:
              flutter:
                sdk: flutter
            PUBSPEC
              mkdir -p ./project_source/lib
              echo "void main(){}" > ./project_source/lib/main.dart
              echo "✅ Minimal project created"
            else
              # Extract ZIP
              ZIP_FILE=$(find ./release_assets -name "*.zip" -type f | head -n 1)
              if [ -f "$ZIP_FILE" ]; then
                echo "📥 Extracting: $(basename $ZIP_FILE)"
                unzip -q -o "$ZIP_FILE" -d ./project_source/
                echo "✅ Extracted successfully"
                rm -rf ./release_assets
              fi
            fi
          fi
          
          echo "📂 Project structure:"
          ls -la ./project_source/ | head -20
      
      - name: Detect project type
        id: detect
        run: |
          cd ./project_source
          
          if [ -f "pubspec.yaml" ]; then
            echo "project_type=flutter" >> $GITHUB_OUTPUT
            echo "✅ Detected Flutter project"
          elif [ -f "build.gradle" ] || [ -f "app/build.gradle" ]; then
            echo "project_type=android" >> $GITHUB_OUTPUT
            echo "✅ Detected Android Studio project"
          elif [ -f "package.json" ]; then
            echo "project_type=react" >> $GITHUB_OUTPUT
            echo "✅ Detected React Native project"
          else
            echo "project_type=flutter" >> $GITHUB_OUTPUT
            echo "⚠️ Unknown project, defaulting to Flutter"
          fi
      
      - name: Build Flutter APK
        if: steps.detect.outputs.project_type == 'flutter'
        run: |
          cd ./project_source
          
          echo "🔨 Building Flutter APK..."
          
          # Clean & Get packages
          flutter clean
          flutter pub get
          
          # Build APK
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "📱 Building RELEASE APK..."
            flutter build apk --release --split-per-abi
          else
            echo "📱 Building DEBUG APK..."
            flutter build apk --debug
          fi
          
          # Copy hasil build
          mkdir -p ../app_build
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk ../app_build/
            echo "✅ Release APK copied"
          elif [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk ../app_build/
            echo "✅ Debug APK copied"
          else
            echo "⚠️ No APK found in expected location, searching..."
            find . -name "*.apk" -type f -exec cp {} ../app_build/ \;
          fi
      
      - name: Build Android Studio APK
        if: steps.detect.outputs.project_type == 'android'
        run: |
          cd ./project_source
          
          echo "🔨 Building Android APK..."
          
          # Give permission
          chmod +x gradlew
          
          # Build APK
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "📱 Building RELEASE APK..."
            ./gradlew assembleRelease
          else
            echo "📱 Building DEBUG APK..."
            ./gradlew assembleDebug
          fi
          
          # Copy hasil build
          mkdir -p ../app_build
          find . -name "*.apk" -exec cp {} ../app_build/ \;
          echo "✅ APK copied"
      
      - name: Build React Native APK
        if: steps.detect.outputs.project_type == 'react'
        run: |
          cd ./project_source
          
          echo "🔨 Building React Native APK..."
          
          # Install dependencies
          npm install
          
          # Build APK
          cd android
          chmod +x gradlew
          
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "📱 Building RELEASE APK..."
            ./gradlew assembleRelease
          else
            echo "📱 Building DEBUG APK..."
            ./gradlew assembleDebug
          fi
          
          # Copy hasil build
          mkdir -p ../../app_build
          find . -name "*.apk" -exec cp {} ../../app_build/ \;
          echo "✅ APK copied"
      
      - name: Rename APK files
        run: |
          mkdir -p ./app_build
          cd ./app_build
          
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              NEW_NAME="${{ github.event.inputs.app_name }}_${{ github.event.inputs.build_type }}_${GITHUB_RUN_ID}.apk"
              mv "$apk" "$NEW_NAME"
              echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
              echo "✅ Renamed: $NEW_NAME"
            fi
          done
      
      - name: Upload APK as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: ./app_build/*.apk
          retention-days: 7
      
      - name: Get APK size
        id: apk_info
        run: |
          mkdir -p ./app_build
          cd ./app_build
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -f "$APK_FILE" ]; then
            SIZE=$(stat -c%s "$APK_FILE")
            SIZE_MB=$(echo "scale=2; $SIZE/1048576" | bc)
            echo "apk_size=$SIZE_MB MB" >> $GITHUB_OUTPUT
            echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
            echo "✅ APK built successfully: $APK_FILE ($SIZE_MB MB)"
          else
            echo "⚠️ No APK found"
            ls -la ./
          fi
      
      - name: Build success notification
        if: success()
        run: |
          echo "✅ BUILD SUCCESS!"
          echo "📱 App Name: ${{ github.event.inputs.app_name }}"
          echo "🔧 Build Type: ${{ github.event.inputs.build_type }}"
          echo "📦 Size: ${{ steps.apk_info.outputs.apk_size }}"
          echo "📄 File: ${{ steps.apk_info.outputs.apk_file }}"
      
      - name: Build failure notification
        if: failure()
        run: |
          echo "❌ BUILD FAILED!"
          echo "📱 App Name: ${{ github.event.inputs.app_name }}"
          echo "🔧 Build Type: ${{ github.event.inputs.build_type }}"
          echo "Check logs for details"
          
